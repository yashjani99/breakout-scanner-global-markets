name: Build Installers

on:
  push:
    branches: [ main, master ]
    paths:
      - "BreakoutScannerApp/**"
      - ".github/workflows/build-installers.yml"
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BreakoutScannerApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install cx_Freeze pyinstaller

      - name: Build standalone EXE (PyInstaller)
        run: >
          python -m PyInstaller --onefile --windowed --name BreakoutScannerGlobalMarkets
          --hidden-import=yfinance --hidden-import=pandas --hidden-import=pytz
          --hidden-import=requests --hidden-import=reportlab breakout_scanner_app.py

      - name: Build MSI (cx_Freeze)
        run: python setup_freeze.py bdist_msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            BreakoutScannerApp/dist/*.exe
            BreakoutScannerApp/dist/*.msi

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BreakoutScannerApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packaging tools + Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3

      - name: Build RPM
        run: bash build_rpm.sh

      - name: Build DEB
        run: bash build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            BreakoutScannerApp/dist/*.rpm
            BreakoutScannerApp/dist/*.deb

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: BreakoutScannerApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DMG (cx_Freeze)
        run: bash build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: BreakoutScannerApp/dist/*.dmg

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name "*.exe" -o -name "*.msi" -o -name "*.rpm" -o -name "*.deb" -o -name "*.dmg" | while read file; do
            cp "$file" release/
          done
          ls -lh release/
      
      - name: Delete existing release if it exists
        run: |
          TAG="v2.0.4"
          # Try to delete the release
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Try to delete the tag
          git push origin --delete "$TAG" 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          tag_name: v2.0.4
          name: Release v2.0.4
          body: |
            Professional stock breakout scanner with global market support.

            **New in v2.0.4:** fixes a data-quality bug where a NaN closing price from
            Yahoo Finance (session not fully settled yet) could silently leak into RSI
            5-Star / Confluence results as a null CMP/Entry/T1. Also extracts the scanning
            logic into a standalone scanner_core.py module (no GUI dependency), reused by
            the website's new daily scan data pipeline.

            **New in v2.0.3:** a third strategy option, Confluence (Both) - only stocks
            that pass both Breakout (DMA + CAR) and RSI 5-Star at once - plus a cleaned-up
            two-row header layout that fixed clipped/overlapping controls on smaller
            windows.

            **New in v2.0.2:** a second scan strategy - RSI 5-Star (multi-timeframe RSI
            pullback setup: Monthly/Weekly RSI > 60, Daily RSI pullback near 40, entry on
            breakout above the signal candle's high) - selectable via a Strategy picker
            alongside the existing Breakout (DMA + CAR) strategy.

            **Includes:**
            - Windows MSI Installer & Portable EXE
            - Linux .deb (Debian/Ubuntu)
            - Linux .rpm (Fedora/RHEL)
            - macOS .dmg

            All installers bundle Python and dependencies - no installation required.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
