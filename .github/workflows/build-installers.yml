name: Build Installers

on:
  push:
    branches: [ main, master ]
    paths:
      - "BreakoutScannerApp/**"
      - ".github/workflows/build-installers.yml"
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BreakoutScannerApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install cx_Freeze pyinstaller

      - name: Build standalone EXE (PyInstaller)
        run: >
          python -m PyInstaller --onefile --windowed --name BreakoutScannerIndianMarket
          --hidden-import=yfinance --hidden-import=pandas --hidden-import=pytz
          --hidden-import=requests --hidden-import=reportlab breakout_scanner_app.py

      - name: Build MSI (cx_Freeze)
        run: python setup_freeze.py bdist_msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            BreakoutScannerApp/dist/*.exe
            BreakoutScannerApp/dist/*.msi

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BreakoutScannerApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packaging tools + Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3

      - name: Build RPM
        run: bash build_rpm.sh

      - name: Build DEB
        run: bash build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            BreakoutScannerApp/dist/*.rpm
            BreakoutScannerApp/dist/*.deb

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: BreakoutScannerApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DMG (cx_Freeze)
        run: bash build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: BreakoutScannerApp/dist/*.dmg

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name "*.exe" -o -name "*.msi" -o -name "*.rpm" -o -name "*.deb" -o -name "*.dmg" | while read file; do
            cp "$file" release/
          done
          ls -lh release/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          body: |
            Professional stock breakout scanner with global market support.
            
            **Includes:**
            - Windows MSI Installer & Portable EXE
            - Linux .deb (Debian/Ubuntu)
            - Linux .rpm (Fedora/RHEL)
            - macOS .dmg
            
            All installers bundle Python and dependencies - no installation required.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: "2.0.1"
